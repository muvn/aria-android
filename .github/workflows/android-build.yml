name: Build Aria Android (No AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Force Init Submodules
      run: git submodule update --init --recursive

    - name: Clone required core libraries
      run: |
        echo "Cloning aria-mobile-core..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-mobile-core.git ../aria-mobile-core
        
        echo "Cloning aria-ai-core..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-ai-core.git ../aria-ai-core || true

    - name: Setup vendor dependencies (From Official aria-vendor)
      run: |
        # 直接拉取包含 system-ggml 补丁的官方 vendor 仓库
        git clone https://github.com/5060-Solutions/aria-vendor.git ../vendor || true
        
        # 确保 Cargo.toml 能够将它们正确识别为工作区成员
        if [ -d "../vendor" ]; then
          echo '[workspace]' > ../vendor/Cargo.toml
          echo 'members = ["llama-cpp-sys-2", "whisper-rs-sys"]' >> ../vendor/Cargo.toml
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Setup Android NDK
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    # 【核心修复】：动态替换脚本中硬编码的 macOS 工具链路径为 Linux 路径
    - name: Fix macOS hardcoded path and grant permissions
      run: |
        sed -i 's/darwin-x86_64/linux-x86_64/g' build-rust.sh
        chmod +x build-rust.sh
        chmod +x gradlew

    - name: Build Rust Core (SIP Only)
      env:
        AI: '0'
      run: ./build-rust.sh release

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aria-android-apk
        path: app/build/outputs/apk/debug/*.apk
