name: Build Aria Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4
  # 新增：手动拉取 Rust 核心库到上一级目录，以满足 ../aria-mobile-core 的路径要求
    - name: Clone aria-mobile-core
      run: git clone https://github.com/5060-Solutions/aria-mobile-core.git ../aria-mobile-core

    # 2. 配置 Java 17 开发环境 (Android 编译基础)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 配置 Rust 工具链及目标平台
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    # 4. 配置 Android NDK (GitHub Runner 默认包含 NDK)
    - name: Set ANDROID_NDK_HOME
      run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    # 5. 注入临时的 Firebase 配置文件
    # Gradle 编译时如果集成了 google-services 插件，缺失该文件会导致编译直接失败。
    # 这里创建一个 mock 文件仅用于通过 CI 编译检查。
    - name: Create mock google-services.json
      run: |
        echo '{
          "project_info": { "project_number": "123456789012", "project_id": "mock-project" },
          "client": [{
            "client_info": { 
              "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", 
              "android_client_info": { "package_name": "com.solutions5060.aria" } 
            }
          }]
        }' > app/google-services.json

    # 6. 赋予构建脚本执行权限
    - name: Grant execute permission for scripts
      run: |
        chmod +x build-rust.sh
        chmod +x gradlew

    # 7. 编译 Rust 核心代码 (UniFFI 绑定)
    - name: Build Rust Core
      run: ./build-rust.sh

    # 8. 执行 Android 打包
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 9. 上传生成的 APK 产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aria-android-apk
        path: app/build/outputs/apk/debug/*.apk
