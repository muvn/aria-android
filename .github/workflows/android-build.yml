name: Build Aria Android (No AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取您的 Android 代码，并递归获取可能存在的子模块
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Force Init Submodules
      run: git submodule update --init --recursive

    # 2. 拉取必备的核心库，并处理 Cargo 的依赖预检查
    - name: Clone required core libraries
      run: |
        echo "Cloning aria-mobile-core..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-mobile-core.git ../aria-mobile-core
        
        echo "Cloning aria-ai-core just to satisfy Cargo workspace resolution..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-ai-core.git ../aria-ai-core || true
        
        # 核心逻辑：替换掉导致报错的 system-ggml 依赖，直接放行 Cargo 预检查
        if [ -f "../aria-ai-core/Cargo.toml" ]; then
          sed -i 's/"system-ggml"/"coreml"/g' ../aria-ai-core/Cargo.toml
        fi

    # 3. 配置 Java 17 (Android Gradle 编译要求)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. 配置 Rust 及 Android 目标架构
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    # 5. 配置构建脚本所需的 NDK 环境变量
    - name: Setup Android NDK
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    # 6. 赋予脚本执行权限
    - name: Grant execute permissions
      run: |
        chmod +x build-rust.sh
        chmod +x gradlew

    # 7. 编译 Rust 核心库 (AI=0 表示只编译纯 SIP 通话功能)
    - name: Build Rust Core (SIP Only)
      env:
        AI: '0'
      run: ./build-rust.sh release

    # 8. 执行 Android 打包
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 9. 输出 APK 产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aria-android-apk
        path: app/build/outputs/apk/debug/*.apk
