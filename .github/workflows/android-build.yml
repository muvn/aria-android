name: Build Aria Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Force Init Submodules
      run: git submodule update --init --recursive

    - name: Clone aria-mobile-core
      run: git clone --recurse-submodules https://github.com/5060-Solutions/aria-mobile-core.git ../aria-mobile-core

    - name: Setup vendor dependencies
      run: |
        if [ -d "vendor/llama-cpp-sys-2" ]; then
          echo "Found vendor in aria-android, copying to parent workspace..."
          mkdir -p ../vendor
          cp -r vendor/llama-cpp-sys-2 ../vendor/
        else
          echo "Vendor not found locally. Cloning into ../vendor..."
          mkdir -p ../vendor
          
          git clone https://github.com/5060-Solutions/llama-cpp-sys-2.git ../vendor/llama-cpp-sys-2 || {
            echo "Failed to clone from 5060-Solutions. Trying official upstream..."
            git clone https://github.com/utilityai/llama-cpp-rs.git /tmp/llama-cpp-rs
            cp -r /tmp/llama-cpp-rs/llama-cpp-sys-2 ../vendor/
          }
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Set ANDROID_NDK_HOME
      run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Create mock google-services.json
      run: |
        echo '{
          "project_info": { "project_number": "123456789012", "project_id": "mock-project" },
          "client": [{
            "client_info": { 
              "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", 
              "android_client_info": { "package_name": "com.solutions5060.aria" } 
            }
          }]
        }' > app/google-services.json

    - name: Grant execute permission for scripts
      run: |
        chmod +x build-rust.sh
        chmod +x gradlew

    - name: Build Rust Core
      run: ./build-rust.sh

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aria-android-apk
        path: app/build/outputs/apk/debug/*.apk
