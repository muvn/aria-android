name: Build Aria Android (No AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Force Init Submodules
      run: git submodule update --init --recursive

    - name: Clone required core libraries
      run: |
        echo "Cloning aria-mobile-core..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-mobile-core.git ../aria-mobile-core
        
        echo "Cloning aria-ai-core just to satisfy Cargo workspace resolution..."
        git clone --recurse-submodules https://github.com/5060-Solutions/aria-ai-core.git ../aria-ai-core || true

    - name: Setup vendor dependencies (The Ultimate Fix)
      run: |
        mkdir -p ../vendor
        if [ -d "vendor" ]; then cp -r vendor/* ../vendor/ || true; fi
        
        # 1. 拉取官方 llama-cpp-rs
        if [ ! -d "../vendor/llama-cpp-sys-2" ]; then
          git clone https://github.com/utilityai/llama-cpp-rs.git /tmp/llama-cpp-rs || true
          cp -r /tmp/llama-cpp-rs/llama-cpp-sys-2 ../vendor/ || true
        fi
        
        # 2. 拉取官方 whisper-rs
        if [ ! -d "../vendor/whisper-rs-sys" ]; then
          git clone https://github.com/tazz4843/whisper-rs.git /tmp/whisper-rs || true
          if [ -d "/tmp/whisper-rs/whisper-rs-sys" ]; then
            cp -r /tmp/whisper-rs/whisper-rs-sys ../vendor/
          elif [ -d "/tmp/whisper-rs/sys" ]; then
            cp -r /tmp/whisper-rs/sys ../vendor/whisper-rs-sys
          fi
        fi
        
        # 3. 【暴力破解核心】：直接向底层依赖强行注入缺失的特性，完美骗过 Cargo
        echo "Injecting system-ggml into whisper-rs-sys..."
        if grep -q "\[features\]" ../vendor/whisper-rs-sys/Cargo.toml; then
          sed -i 's/\[features\]/\[features\]\nsystem-ggml = \[\]/g' ../vendor/whisper-rs-sys/Cargo.toml
        else
          printf "\n[features]\nsystem-ggml = []\n" >> ../vendor/whisper-rs-sys/Cargo.toml
        fi
        
        # 4. 双重保险：无视格式，直接暴力替换上层调用的文本
        if [ -f "../aria-ai-core/Cargo.toml" ]; then
          sed -i 's/system-ggml/coreml/g' ../aria-ai-core/Cargo.toml
        fi
        
        # 构建工作区配置
        echo '[workspace]' > ../vendor/Cargo.toml
        echo 'members = ["llama-cpp-sys-2", "whisper-rs-sys"]' >> ../vendor/Cargo.toml
        if [ -f "/tmp/llama-cpp-rs/Cargo.toml" ]; then
          sed -n '/\[workspace.dependencies\]/,$p' /tmp/llama-cpp-rs/Cargo.toml >> ../vendor/Cargo.toml
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Setup Android NDK
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Grant execute permissions
      run: |
        chmod +x build-rust.sh
        chmod +x gradlew

    - name: Build Rust Core (SIP Only)
      env:
        AI: '0'
      run: ./build-rust.sh release

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aria-android-apk
        path: app/build/outputs/apk/debug/*.apk
